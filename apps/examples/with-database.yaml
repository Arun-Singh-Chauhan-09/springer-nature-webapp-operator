# needsDatabase provisions a CloudNativePG Postgres cluster (GitOps mode, see apps/orders.yaml).
# Without --enable-databases the WebApp is Degraded with reason DatabasesDisabled.
apiVersion: platform.example.com/v1
kind: WebApp
metadata:
  name: shop
  namespace: demo
spec:
  image: ghcr.io/stefanprodan/podinfo:6.7.1
  replicas: 1
  port: 9898
  healthPath: /healthz
  needsDatabase: true
