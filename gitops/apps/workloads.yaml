# Wave 1: what product teams own: their WebApps (apps/*.yaml, not apps/examples).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp-workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Arun-Singh-Chauhan-09/springer-nature-webapp-operator.git
    targetRevision: main
    path: apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - SkipDryRunOnMissingResource=true
