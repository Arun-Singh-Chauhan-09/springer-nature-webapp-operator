# What ArgoCD deploys for the operator: the operator and its admission webhook
# (config/webhook, which includes config/operator),
# its monitoring (ServiceMonitor, alerts, Grafana dashboard) from config/monitoring,
# with the image swapped from the local dev tag to the one CI published to GHCR.
# Promote a new build with: make pin-image (pins to the current commit's sha-<short> tag).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../config/webhook   # operator + admission webhook (config/operator is included there)
  - ../../config/monitoring
images:
  - name: webapp-operator
    newName: ghcr.io/arun-singh-chauhan-09/webapp-operator
    newTag: sha-856e110
