apiVersion: v1
kind: Namespace
metadata:
  name: webapp-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webapp-operator
  namespace: webapp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: webapp-operator
rules:
  - apiGroups: [platform.example.com]
    resources: [webapps]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [platform.example.com]
    resources: [webapps/status]
    verbs: [get, update, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: webapp-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: webapp-operator
subjects:
  - kind: ServiceAccount
    name: webapp-operator
    namespace: webapp-system
---
# Leader election only needs leases in its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webapp-operator-leader-election
  namespace: webapp-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webapp-operator-leader-election
  namespace: webapp-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webapp-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: webapp-operator
    namespace: webapp-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-operator
  namespace: webapp-system
  labels:
    app.kubernetes.io/name: webapp-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webapp-operator
    spec:
      serviceAccountName: webapp-operator
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: webapp-operator:dev
          imagePullPolicy: IfNotPresent
          args: [--leader-elect]
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-operator-metrics
  namespace: webapp-system
  labels:
    app.kubernetes.io/name: webapp-operator
spec:
  selector:
    app.kubernetes.io/name: webapp-operator
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
