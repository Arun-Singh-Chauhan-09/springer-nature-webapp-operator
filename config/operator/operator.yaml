apiVersion: v1
kind: Namespace
metadata:
  name: webapp-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webapp-operator
  namespace: webapp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: webapp-operator
rules:
  - apiGroups: [platform.example.com]
    resources: [webapps]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [platform.example.com]
    resources: [webapps/status]
    verbs: [get, update, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  # Databases for WebApps with needsDatabase (only used with --enable-databases)
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, watch, create, update, patch, delete]
  # Secure metrics: check the caller's token (TokenReview) and its right to GET /metrics (SubjectAccessReview)
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: webapp-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: webapp-operator
subjects:
  - kind: ServiceAccount
    name: webapp-operator
    namespace: webapp-system
---
# Leader election only needs leases in its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webapp-operator-leader-election
  namespace: webapp-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webapp-operator-leader-election
  namespace: webapp-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webapp-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: webapp-operator
    namespace: webapp-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-operator
  namespace: webapp-system
  labels:
    app.kubernetes.io/name: webapp-operator
spec:
  # 2 replicas: leader election lets only one reconcile, but both serve the admission
  # webhook, so a drain or crash of one pod never blocks deploys (failurePolicy: Fail).
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webapp-operator
    spec:
      serviceAccountName: webapp-operator
      terminationGracePeriodSeconds: 10
      affinity:
        podAntiAffinity:
          # Spread across nodes where possible; "preferred" so a 1-node kind cluster still schedules both.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: webapp-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: webapp-operator:dev
          imagePullPolicy: IfNotPresent
          args: [--leader-elect]
          ports:
            - name: metrics
              containerPort: 8443
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # writable scratch space on a read-only root filesystem
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: webapp-operator
  namespace: webapp-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp-operator
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-operator-metrics
  namespace: webapp-system
  labels:
    app.kubernetes.io/name: webapp-operator
spec:
  selector:
    app.kubernetes.io/name: webapp-operator
  ports:
    - name: metrics
      port: 8443
      targetPort: metrics
---
# Whoever may scrape /metrics (Prometheus' own ClusterRole already allows it).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: webapp-operator-metrics-reader
rules:
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
# Used by `make metrics` to read the endpoint by hand.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-reader
  namespace: webapp-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: webapp-operator-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: webapp-operator-metrics-reader
subjects:
  - kind: ServiceAccount
    name: metrics-reader
    namespace: webapp-system
