# Monitoring for the operator. Needs the Prometheus Operator CRDs, so it is only
# deployed in GitOps mode (gitops/operator), after the monitoring app (wave -2).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - servicemonitor.yaml
  - prometheusrule.yaml
configMapGenerator:
  - name: grafana-dashboard-platform-health
    namespace: webapp-system
    files:
      - dashboards/platform-health.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
