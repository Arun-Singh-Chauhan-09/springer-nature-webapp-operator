# Prometheus scrapes the operator's /metrics (webapp_* + controller_runtime_*).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: webapp-operator
  namespace: webapp-system
  labels:
    app.kubernetes.io/name: webapp-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp-operator
  endpoints:
    - port: metrics
      # HTTPS + ServiceAccount token: the operator checks the token with TokenReview and
      # SubjectAccessReview (GET /metrics). The cert is self-signed, so verification is skipped;
      # see README "Security" for the cert-manager follow-up.
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        insecureSkipVerify: true
      # The operator exports its own "namespace" label (the WebApp's namespace).
      # Without this, Prometheus overwrites it with the scrape target's namespace
      # (webapp-system) and renames ours to exported_namespace.
      honorLabels: true
      interval: 15s
