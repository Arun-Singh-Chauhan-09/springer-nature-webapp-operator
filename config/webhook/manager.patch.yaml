# GitOps mode: turns on the admission webhook (cert-manager certificate mounted) and
# CloudNativePG databases with Barman Cloud backups to the platform object store.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-operator
  namespace: webapp-system
spec:
  template:
    spec:
      containers:
        - name: manager
          args:
            - --leader-elect
            - --enable-webhooks
            - --enable-databases
            - --db-backup-object-store=platform-backups
          ports:
            - name: webhook
              containerPort: 9443
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        - name: webhook-certs
          secret:
            secretName: webapp-operator-webhook-tls
