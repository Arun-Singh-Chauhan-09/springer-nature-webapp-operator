apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webapps.platform.example.com
spec:
  group: platform.example.com
  names:
    kind: WebApp
    listKind: WebAppList
    plural: webapps
    singular: webapp
    shortNames: [wa]
    categories: [platform]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Desired
          type: integer
          jsonPath: .spec.replicas
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: WebApp is a developer-facing abstraction over Deployment + Service (+ database).
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [image, port]
              properties:
                image:
                  type: string
                  minLength: 1
                  description: Container image, pinned to a tag. ":latest" and untagged images are rejected.
                  x-kubernetes-validations:
                    - rule: "self.contains(':') || self.contains('@sha256:')"
                      message: "image must be pinned to a tag or digest (e.g. my-app:1.4.2)"
                    - rule: "!self.endsWith(':latest')"
                      message: "the ':latest' tag is not allowed; pin a version"
                replicas:
                  type: integer
                  format: int32
                  minimum: 0
                  maximum: 20
                  default: 1
                port:
                  type: integer
                  format: int32
                  minimum: 1024
                  maximum: 65535
                  description: Container port. Must be >= 1024 because apps run as non-root.
                healthPath:
                  type: string
                  pattern: '^/.*'
                  default: /
                needsDatabase:
                  type: boolean
                  default: false
                resources:
                  type: object
                  description: Overrides the platform default requests/limits.
                  properties:
                    limits:
                      type: object
                      additionalProperties:
                        anyOf: [{type: integer}, {type: string}]
                        x-kubernetes-int-or-string: true
                    requests:
                      type: object
                      additionalProperties:
                        anyOf: [{type: integer}, {type: string}]
                        x-kubernetes-int-or-string: true
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                readyReplicas:
                  type: integer
                  format: int32
                phase:
                  type: string
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
